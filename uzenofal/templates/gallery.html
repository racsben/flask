{% extends 'index.html' %}

{% block content %}

    {% for aru in aruk %}
    <a href="{{ url_for('card', object_id=aru.id) }}" class="card-link">
    <div class="card mt-3" style="width: 18rem;">
        
        <div class="card-body">
            <h5 class="card-title">{{ aru.title }}</h5>
            <p class="card-text">{{ aru.price }}</p>
            <p class="card-text">{{ aru.feltolto.username }}</p>
            <p class="card-text">{{ aru.date.strftime('%Y-%m-%d' )}}</p>
            
        </div>
    </div>
    </a>
    {% endfor %}

{% endblock content%}
